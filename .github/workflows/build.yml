name: build

on:
  push:
    branches: [ net10 ]
    tags:     [ 'v1.*' ]
  pull_request:
    branches: [ net10 ]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 创建 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore newgdq/newgdq.csproj

      - name: Build (Release)
        run: dotnet build newgdq/newgdq.csproj -c Release --no-restore -v minimal

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            "ci-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $zip = "zhouzhou-typing-net10-v$version.zip"
          $out = "newgdq\bin\Release"
          $stage = "stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          # 拷整个 Release 目录，排除调试文件（.pdb / .xml）减小体积
          Copy-Item -Recurse -Force "$out\*" $stage
          Get-ChildItem -Recurse $stage -Include *.pdb,*.xml | Remove-Item -Force
          # 附带项目根的文档文件
          Copy-Item -Force README.md,LICENSE,NOTICE $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          "zip=$zip"     | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhouzhou-typing-net10-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.zip }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
