name: build

on:
  push:
    branches: [ main ]
    tags:     [ 'v0.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 创建 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore newgdq/packages.config -PackagesDirectory packages

      - name: Build (Release)
        run: msbuild newgdq/newgdq.csproj /t:Build /p:Configuration=Release /v:minimal /nologo

      - name: Package zip
        id: pack
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            "ci-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $zip = "zhouzhou-typing-v$version.zip"
          $out = "newgdq\bin\Release"
          $stage = "stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          # 拷整个 Release 目录，排除调试文件（.pdb / .xml）减小体积
          Copy-Item -Recurse -Force "$out\*" $stage
          Get-ChildItem -Recurse $stage -Include *.pdb,*.xml | Remove-Item -Force
          # 附带项目根的文档文件
          Copy-Item -Force README.md,LICENSE,NOTICE $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          "zip=$zip"     | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhouzhou-typing-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.zip }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
